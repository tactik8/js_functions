name: Auto Build and Commit to Main

on:
  push:
    branches: [ main ]

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }} # Forces GitHub to use your high-privilege token
          branch: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install && npm install -D webpack-cli

      - name: Compile Code
        run: npm run build

      - name: Commit and Push Build Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -f dist/
          
          if git diff --cached --quiet; then
            echo "No changes detected in build output. Skipping repository update."
          else
            git commit -m "chore: automated build update [skip ci]"
            git push origin HEAD:main
          fi

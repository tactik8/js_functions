name: Build and Publish Package

on:
  release:
    types: [published] # Triggers when you create a GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Grants permission to publish the package
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
      
      - name: Install webpack
        run: npm install -D webpack-cli

      - name: Install Dependencies2
        run: npm install --yes
        
      - name: Install Dependencies
        run: npm ci --yes

      - name: Run Build Script
        run: npm run build

      - name: Commit and Push Build Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # Stage the dist folder changes
          git add dist/
          
          # Check if there are actually changes to commit (prevents empty commit failures)
          if git diff --cached --quiet; then
            echo "No changes detected in build output. Skipping commit."
          else
            git commit -m "chore: automated build update [skip ci]"
            git push
          fi

name: Build and Publish Package

on:
  release:
    types: [published] # Triggers when you create a GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Grants permission to publish the package
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
      
      - name: Install webpack
        run: npm install -D webpack-cli

      - name: Install Dependencies2
        run: npm install --yes
        
      - name: Install Dependencies
        run: npm ci --yes

      - name: Run Build Script
        run: npm run build

      - name: Store Build Result
        uses: actions/upload-artifact@v4
        with:
          name: production-build       # The name of your zip file
          path: dist/                  # The folder you want to save
          retention-days: 300    
